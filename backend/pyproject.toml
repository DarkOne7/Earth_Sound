[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earth-jukebox-backend"
version = "0.1.0"
description = "Backend for turning ocean measurements into reproducible soundscapes."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "netCDF4",
    "numpy",
    "pandas",
    "pydantic-settings",
    "requests",
    "uvicorn",
    "xarray",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
